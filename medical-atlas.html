<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现代医学知识版图 · The Atlas of Modern Medicine</title>
<meta name="description" content="从认识生命到群体健康：7 个阶段、约 75 个学科节点的现代医学知识地图。点击卡片查看详情，支持搜索与深色模式。">
<style>
/* ============ 基础与主题 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.nofx { scroll-behavior: auto; }
html.nofx *, html.nofx *::before, html.nofx *::after { transition: none !important; animation: none !important; }

:root {
  --paper: #F6F1E7;
  --paper2: #EFE7D8;
  --card: #FFFCF5;
  --ink: #1F2B37;
  --ink2: #58646F;
  --ink3: #8B949D;
  --line: #DCD3C0;
  --line2: #C7BCA5;
  --gold: #A96F1B;
  --serif: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
  --barh: 56px;
  color-scheme: light;
}
html[data-theme="dark"] {
  --paper: #131A21;
  --paper2: #0F151B;
  --card: #1A232D;
  --ink: #E9E4D8;
  --ink2: #A8B0B8;
  --ink3: #78828C;
  --line: #2B3641;
  --line2: #3D4A57;
  --gold: #C99B4A;
  color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 640px) { .container { padding: 0 16px; } }

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: rgba(169,111,27,.25); }

.kicker {
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--gold); font-weight: 700;
}
.hairline { border: none; border-top: 1px solid var(--line); }

/* ============ 封面区 ============ */
.hero { padding: 56px 0 8px; }
.masthead { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--line2); padding: 26px 0 22px; position: relative; }
.masthead::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; border-bottom: 1px solid var(--line); }
.hero h1 {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(38px, 6.5vw, 72px); line-height: 1.08;
  letter-spacing: .02em; margin: 10px 0 6px;
}
.hero-en { font-family: var(--serif); font-style: italic; font-size: clamp(14px, 2vw, 19px); color: var(--ink2); letter-spacing: .04em; }
.hero .deck {
  font-family: var(--serif); font-size: clamp(16px, 1.9vw, 19px); line-height: 1.9;
  color: var(--ink2); max-width: 760px; margin: 22px 0 0;
}
.stats { display: flex; flex-wrap: wrap; gap: 0; margin: 26px 0 4px; }
.stat { padding: 2px 26px 2px 0; margin-right: 26px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: none; }
.stat b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--ink2); letter-spacing: .06em; }

/* 顶部流动装饰线 */
.ekg { display: block; width: 100%; height: 34px; margin-top: 22px; color: var(--line2); opacity: .8; }

/* ============ 全流程导览条（封面内） ============ */
.flowrail { margin: 30px 0 6px; }
.flowrail-line { position: relative; height: 3px; border-radius: 2px; margin: 0 10px 0 10px; }
.flowrail-items { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: -14px; }
.fitem { display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 14px; }
.fitem .fdot {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--fc); position: relative; z-index: 1;
  transition: transform .15s;
}
.fitem .fnum { font-family: var(--serif); font-size: 12px; color: var(--ink3); letter-spacing: .12em; }
.fitem .fname { font-size: 13px; font-weight: 700; color: var(--ink); text-align: center; }
.fitem:hover .fdot { transform: scale(1.25); }
.fitem:hover .fname { color: var(--fc); }

/* ============ 使用说明与图例 ============ */
.guide { display: flex; flex-wrap: wrap; gap: 14px; margin: 30px 0 6px; }
.gbox { flex: 1 1 320px; border: 1px solid var(--line); background: var(--card); padding: 16px 20px; border-radius: 3px; }
.gbox h3 { font-size: 12px; letter-spacing: .18em; color: var(--ink3); text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
.gbox ul { list-style: none; }
.gbox li { font-size: 13.5px; color: var(--ink2); padding: 3px 0 3px 20px; position: relative; }
.gbox li::before { content: ""; position: absolute; left: 2px; top: 12px; width: 7px; height: 7px; border: 1.5px solid var(--gold); transform: rotate(45deg); }
.gbox li b { color: var(--ink); }

/* ============ 粘性流程条 ============ */
#flowbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--paper2); border-bottom: 1px solid var(--line2);
}
#flowbar.shadowed { box-shadow: 0 2px 12px rgba(31,43,55,.10); }
html[data-theme="dark"] #flowbar.shadowed { box-shadow: 0 2px 14px rgba(0,0,0,.45); }
.fb-inner { display: flex; align-items: center; gap: 14px; height: var(--barh); }
.fb-title { font-family: var(--serif); font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: .02em; flex: 0 0 auto; }
.fb-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
.fb-chips::-webkit-scrollbar { display: none; }
.fchip {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink2); background: var(--card);
  transition: background .15s, color .15s, border-color .15s;
}
.fchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--fc); }
.fchip.act { background: var(--fc); border-color: var(--fc); color: #fff; }
.fchip.act i { background: #fff; }
html[data-theme="dark"] .fchip.act { color: #10161C; }
html[data-theme="dark"] .fchip.act i { background: #10161C; }
.fb-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.iconbtn {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; background: var(--card);
  transition: border-color .15s, background .15s;
}
.iconbtn:hover { border-color: var(--ink2); }
.iconbtn svg { width: 17px; height: 17px; }
#progress { height: 2px; background: var(--gold); width: 0; }

/* 搜索 */
.searchwrap { position: relative; }
.searchbox {
  display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card); width: 200px;
  transition: width .2s, border-color .15s;
}
.searchbox:focus-within { border-color: var(--gold); width: 250px; }
.searchbox svg { width: 14px; height: 14px; color: var(--ink3); flex: 0 0 auto; }
.searchbox input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: var(--ink); }
.searchbox input::placeholder { color: var(--ink3); }
.searchres {
  position: absolute; top: 42px; right: 0; width: 340px; max-width: 88vw;
  background: var(--card); border: 1px solid var(--line2); border-radius: 4px;
  box-shadow: 0 8px 30px rgba(31,43,55,.18); max-height: 330px; overflow-y: auto; display: none; z-index: 60;
}
html[data-theme="dark"] .searchres { box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.searchres.open { display: block; }
.sres-item { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.sres-item:last-child { border-bottom: none; }
.sres-item:hover, .sres-item.hov { background: var(--paper2); }
.sres-item b { font-size: 13.5px; }
.sres-item span { font-size: 11.5px; color: var(--ink3); }
.sres-item em { margin-left: auto; font-style: normal; font-size: 11px; color: #fff; background: var(--fc); padding: 1px 8px; border-radius: 999px; flex: 0 0 auto; }
.sres-empty { padding: 14px; font-size: 13px; color: var(--ink3); }

/* ============ 阶段章节 ============ */
.stage { padding-top: 46px; margin-top: 54px; border-top: 2px solid var(--stage); scroll-margin-top: calc(var(--barh) + 14px); position: relative; }
.stage-head { display: flex; align-items: flex-start; gap: 22px; position: relative; }
.stage-ghost {
  font-family: var(--serif); font-weight: 700; font-size: clamp(72px, 11vw, 128px); line-height: 1;
  color: var(--stagesoft); position: absolute; right: 0; top: -26px; user-select: none; pointer-events: none;
}
.stage-num {
  font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--stage);
  border: 1.5px solid var(--stage); border-radius: 50%; width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-top: 6px;
  background: var(--stagesoft);
}
.stage-titles { flex: 1 1 auto; }
.stage-kicker { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--stage); font-weight: 700; }
.stage-titles h2 { font-family: var(--serif); font-size: clamp(28px, 4vw, 42px); line-height: 1.15; margin: 4px 0 4px; letter-spacing: .02em; }
.stage-tagline { font-size: 14.5px; color: var(--ink2); }
.stage-icon { width: 46px; height: 46px; color: var(--stage); flex: 0 0 auto; margin-top: 10px; opacity: .9; }
.stage-icon svg { width: 100%; height: 100%; }
.stage-intro {
  font-family: var(--serif); font-size: 16.5px; line-height: 1.95; color: var(--ink2);
  max-width: 860px; margin: 20px 0 0; padding-left: 74px;
}
.stage-count { font-size: 12px; color: var(--ink3); letter-spacing: .08em; margin-top: 10px; padding-left: 74px; }

.cluster { margin-top: 34px; }
.cluster-label {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--ink2);
}
.cluster-label::before { content: ""; width: 8px; height: 8px; background: var(--stage); transform: rotate(45deg); flex: 0 0 auto; }
.cluster-label::after { content: ""; flex: 1 1 auto; border-top: 1px solid var(--line); }
.cluster-note { font-size: 12px; color: var(--ink3); font-weight: 400; letter-spacing: 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 246px), 1fr)); gap: 12px; }
.card {
  text-align: left; padding: 14px 16px 13px; background: var(--card);
  border: 1px solid var(--line); border-radius: 3px; position: relative;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover { border-color: var(--stage); transform: translateY(-2px); box-shadow: 0 3px 12px rgba(31,43,55,.09); }
html[data-theme="dark"] .card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.4); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.card-name { font-size: 15.5px; font-weight: 700; line-height: 1.4; flex: 1 1 auto; }
.card-en { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin-top: 3px; }
.card-line {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 12.5px; line-height: 1.65; color: var(--ink2); margin-top: 8px; min-height: 41px;
}
.card-badges { display: flex; gap: 4px; flex: 0 0 auto; margin-top: 2px; }
.badge { font-size: 10px; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.badge-cross { color: var(--stage); border: 1px solid var(--stage); background: var(--stagesoft); }
.badge-tcm { color: var(--tcm); border: 1px dashed var(--tcm); }
.card--tcm { border-style: dashed; }
.card--tcm:hover { border-style: solid; }
.card.flash { animation: flashcard 1.5s ease-out 1; border-color: var(--stage); }
@keyframes flashcard {
  0% { background: var(--stagesoft); box-shadow: 0 0 0 3px var(--stagesoft); }
  100% { background: var(--card); box-shadow: none; }
}

/* ============ 详情抽屉 ============ */
#scrim {
  position: fixed; inset: 0; background: rgba(15,20,25,.38); z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 408px; max-width: 94vw; z-index: 70;
  background: var(--card); border-left: 1px solid var(--line2);
  transform: translateX(103%); transition: transform .25s ease;
  display: flex; flex-direction: column;
}
#drawer.open { transform: translateX(0); }
html.nofx #drawer { transition: none; }
.drawer-head {
  display: flex; align-items: center; gap: 8px; padding: 16px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.drawer-stages { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.schip {
  font-size: 11px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--sc);
  color: var(--sc); display: inline-flex; align-items: center; gap: 5px;
  transition: background .15s, color .15s;
}
.schip i { width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
.schip:hover { background: var(--sc); color: #fff; }
.schip:hover i { background: #fff; }
.schip--cur { background: var(--sc); color: #fff; }
.schip--cur i { background: #fff; }
html[data-theme="dark"] .schip:hover, html[data-theme="dark"] .schip--cur { color: #10161C; }
html[data-theme="dark"] .schip:hover i, html[data-theme="dark"] .schip--cur i { background: #10161C; }
.drawer-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.drawer-close:hover { border-color: var(--ink2); background: var(--paper2); }
.drawer-close svg { width: 15px; height: 15px; }
.drawer-body { padding: 20px 22px 30px; overflow-y: auto; }
.drawer-name { font-family: var(--serif); font-size: 27px; line-height: 1.25; font-weight: 700; }
.drawer-en { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin-top: 5px; }
.drawer-tagline { font-size: 14.5px; line-height: 1.85; color: var(--ink2); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.drawer-sect { margin-top: 22px; }
.drawer-sect h4 { font-size: 12px; letter-spacing: .18em; color: var(--ink3); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.drawer-sect h4::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { font-size: 12.5px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); background: var(--paper); }
.drawer-reps { list-style: none; }
.drawer-reps li { font-size: 13.5px; color: var(--ink2); line-height: 1.7; padding: 5px 0 5px 20px; position: relative; }
.drawer-reps li::before { content: ""; position: absolute; left: 3px; top: 13px; width: 6px; height: 6px; background: var(--stage2); transform: rotate(45deg); }
.drawer-note { margin-top: 22px; font-size: 12.5px; color: var(--ink3); border: 1px dashed var(--line2); border-radius: 3px; padding: 10px 14px; line-height: 1.7; }
.drawer-foot { margin-top: 18px; font-size: 12px; color: var(--ink3); }

/* ============ 页脚 ============ */
footer { margin-top: 90px; border-top: 3px solid var(--ink); padding: 26px 0 60px; }
footer .fmeta { display: flex; flex-wrap: wrap; gap: 8px 30px; justify-content: space-between; font-size: 12.5px; color: var(--ink3); }
footer .fnote { font-size: 12.5px; color: var(--ink2); line-height: 1.9; margin-top: 14px; max-width: 900px; }
footer .fsig { font-family: var(--serif); font-style: italic; color: var(--ink3); font-size: 13px; margin-top: 18px; }

/* ============ 响应式 ============ */
@media (max-width: 900px) {
  .fb-title { display: none; }
  .searchbox { width: 150px; }
  .searchbox:focus-within { width: 180px; }
  .stage-ghost { display: none; }
  .stage-intro, .stage-count { padding-left: 0; }
}
@media (max-width: 640px) {
  .hero { padding-top: 34px; }
  .stats { gap: 6px 0; }
  .stat b { font-size: 24px; }
  .flowrail-items { grid-template-columns: repeat(4, 1fr); row-gap: 16px; }
  .flowrail-line { display: none; }
  .fitem { padding-top: 0; }
  .stage-head { gap: 14px; }
  .stage-icon { display: none; }
  .searchbox { width: 34px; padding: 0; justify-content: center; }
  .searchbox input, .searchbox .sinner-label { display: none; }
  .searchwrap.mopen .searchbox { position: absolute; right: 0; top: 4px; width: calc(100vw - 96px); padding: 0 12px; justify-content: flex-start; z-index: 62; }
  .searchwrap.mopen .searchbox input { display: block; }
  #drawer { top: auto; height: 74vh; width: 100%; max-width: 100%; border-left: none; border-top: 1px solid var(--line2); border-radius: 10px 10px 0 0; transform: translateY(103%); }
  #drawer.open { transform: translateY(0); }
}

/* ============ 打印 ============ */
@media print {
  #flowbar, #scrim, #drawer, .searchwrap, .iconbtn, .ekg { display: none !important; }
  body { background: #fff; color: #111; font-size: 12px; }
  .card, .gbox { break-inside: avoid; }
  .stage { break-before: page; border-top-width: 1.5px; }
  .hero { padding-top: 0; }
  .stage-ghost { display: none; }
  a { text-decoration: none; }
}
</style>
</head>

    var use = document.getElementById("themeIconUse");
    if (use) use.setAttribute("href", t === "dark" ? "#ic-sun" : "#ic-moon");
    var btn = document.getElementById("themeBtn");
    if (btn) btn.title = t === "dark" ? "切换浅色模式" : "切换深色模式";
    if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  }
  var initTheme = "light";
  try { var st = localStorage.getItem(THEME_KEY); if (st === "dark" || st === "light") initTheme = st; } catch (e) {}
  if (params.get("theme") === "dark" || params.get("theme") === "light") initTheme = params.get("theme");
  applyTheme(initTheme, false);
  document.getElementById("themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
  });

  /* ---------- 封面 ---------- */
  document.getElementById("heroKicker").textContent = meta.kicker;
  document.getElementById("heroTitle").textContent = meta.title;
  document.getElementById("heroEn").textContent = meta.titleEn;
  document.getElementById("heroDeck").textContent = meta.deck;
  document.getElementById("fbTitle").textContent = meta.title;
  document.getElementById("fDate").textContent = "生成日期 " + meta.date;
  document.getElementById("fSources").textContent = meta.footer.sources;
  document.getElementById("fNote").textContent = meta.footer.note;

  var statsEl = document.getElementById("heroStats");
  [["7", "阶段主线"], [String(cardsCount), "学科卡片"], [String(uniqueIds.length), "门学科"], ["1", "张图看全"]].forEach(function (it) {
    var d = document.createElement("div"); d.className = "stat";
    d.innerHTML = "<b>" + it[0] + "</b><span>" + it[1] + "</span>";
    statsEl.appendChild(d);
  });

  var howto = document.getElementById("howtoList");
  meta.howto.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; howto.appendChild(li); });
  var legend = document.getElementById("legendList");
  meta.legend.forEach(function (t) { var li = document.createElement("li"); li.textContent = t.label; legend.appendChild(li); });

  /* 封面全流程条 */
  var railLine = document.getElementById("flowrailLine");
  railLine.style.background = "linear-gradient(90deg," + meta.stages.map(function (s) { return s.color; }).join(",") + ")";
  var railItems = document.getElementById("flowrailItems");
  meta.stages.forEach(function (s) {
    var b = document.createElement("button");
    b.className = "fitem"; b.style.setProperty("--fc", s.color);
    b.innerHTML = '<span class="fdot"></span><span class="fnum">' + s.num + '</span><span class="fname">' + esc(s.name) + "</span>";
    b.addEventListener("click", function () { scrollToStage(s.id); });
    railItems.appendChild(b);
  });

  /* ---------- 粘性条 ---------- */
  var fbChips = document.getElementById("fbChips");
  meta.stages.forEach(function (s) {
    var b = document.createElement("button");
    b.className = "fchip"; b.style.setProperty("--fc", s.color);
    b.dataset.stage = s.id;
    b.innerHTML = "<i></i>" + esc(s.name);
    b.addEventListener("click", function () { scrollToStage(s.id); });
    fbChips.appendChild(b);
  });
  function setActiveChip(id) {
    Array.prototype.forEach.call(fbChips.children, function (c) {
      c.classList.toggle("act", c.dataset.stage === id);
    });
  }
  function scrollToStage(id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: NOFX ? "auto" : "smooth", block: "start" });
  }

  /* ---------- 渲染阶段正文 ---------- */
  var main = document.getElementById("stages");
  meta.stages.forEach(function (s) {
    var soft = hexToRgba(s.color, .14);
    var sec = document.createElement("section");
    sec.className = "stage"; sec.id = s.id;
    sec.style.setProperty("--stage", s.color);
    sec.style.setProperty("--stage2", s.color);
    sec.style.setProperty("--stagesoft", soft);

    var stageNodes = rawNodes.filter(function (n) { return n.stage === s.id; });
    var head = document.createElement("div");
    head.className = "stage-head";
    head.innerHTML =
      '<div class="stage-ghost">' + s.num + "</div>" +
      '<div class="stage-num">' + s.num + "</div>" +
      '<div class="stage-titles">' +
        '<div class="stage-kicker">STAGE ' + s.num + " · " + esc(s.en) + "</div>" +
        "<h2>" + esc(s.name) + "</h2>" +
        '<div class="stage-tagline">' + esc(s.tagline) + "</div>" +
      "</div>" +
      '<div class="stage-icon"><svg><use href="#ic-' + s.icon + '"/></svg></div>';
    sec.appendChild(head);

    var intro = document.createElement("p");
    intro.className = "stage-intro"; intro.textContent = s.intro;
    sec.appendChild(intro);
    var cnt = document.createElement("div");
    cnt.className = "stage-count"; cnt.textContent = "本章 " + stageNodes.length + " 张卡片";
    sec.appendChild(cnt);

    /* 按 cluster 分组（保持顺序） */
    var clusters = [];
    stageNodes.forEach(function (n) {
      var c = clusters.filter(function (x) { return x.name === n.cluster; })[0];
      if (!c) { c = { name: n.cluster, items: [] }; clusters.push(c); }
      c.items.push(n);
    });
    clusters.forEach(function (c) {
      var box = document.createElement("div"); box.className = "cluster";
      var lab = document.createElement("div"); lab.className = "cluster-label";
      lab.innerHTML = "<span>" + esc(c.name) + "</span>" + (c.name.indexOf("传统医学") >= 0 ? '<span class="cluster-note">独立体系 · 与现代医学并列标注</span>' : "");
      box.appendChild(lab);
      var grid = document.createElement("div"); grid.className = "cards";
      c.items.forEach(function (n) { grid.appendChild(renderCard(n, s)); });
      box.appendChild(grid);
      sec.appendChild(box);
    });
    main.appendChild(sec);
  });

  function renderCard(n, s) {
    var merged = byId[n.id];
    var b = document.createElement("button");
    b.className = "card" + (merged.tcm ? " card--tcm" : "");
    b.dataset.node = n.id; b.dataset.stage = s.id;
    b.id = "card-" + s.id + "-" + n.id;
    var badges = "";
    if (merged.cross) badges += '<span class="badge badge-cross">跨段</span>';
    if (merged.tcm) badges += '<span class="badge badge-tcm">传统医学</span>';
    var line = merged.tagline ? '<span class="card-line">' + esc(merged.tagline) + "</span>" : '<span class="card-line">（跨段重复学科，点击查看完整卡片）</span>';
    b.innerHTML =
      '<span class="card-top"><span><span class="card-name">' + esc(merged.name) + "</span>" +
      '<span class="card-en">' + esc(merged.en) + "</span></span>" +
      '<span class="card-badges">' + badges + "</span></span>" + line;
    b.addEventListener("click", function () { openDrawer(n.id, s.id); });
    return b;
  }

  /* ---------- 滚动联动（含后台冻结兜底） ---------- */
  var sections = meta.stages.map(function (s) { return document.getElementById(s.id); });
  var progressEl = document.getElementById("progress");
  var lastActive = null;
  function computeActive() {
    var y = (window.scrollY || window.pageYOffset || 0) + 130;
    var cur = sections[0].id;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].offsetTop <= y) cur = sections[i].id;
    }
    if (cur !== lastActive) { lastActive = cur; setActiveChip(cur); }
    var doc = document.documentElement;
    var max = (doc.scrollHeight - window.innerHeight);
    var ratio = max > 0 ? Math.min(1, Math.max(0, (window.scrollY || 0) / max)) : 0;
    progressEl.style.width = (ratio * 100).toFixed(2) + "%";
    var bar = document.getElementById("flowbar");
    if (bar) bar.classList.toggle("shadowed", (window.scrollY || 0) > 8);
  }
  window.addEventListener("scroll", computeActive, { passive: true });
  window.addEventListener("resize", computeActive);
  window.addEventListener("visibilitychange", function () { if (!document.hidden) computeActive(); });
  setInterval(function () { if (!document.hidden) computeActive(); }, 700);

  /* ---------- 搜索 ---------- */
  var searchInput = document.getElementById("searchInput");
  var searchRes = document.getElementById("searchRes");
  var searchwrap = document.getElementById("searchwrap");
  function doSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) { searchRes.classList.remove("open"); searchRes.innerHTML = ""; return; }
    var hits = uniqueIds.map(function (id) {
      var m = byId[id];
      var name = (m.name || "").toLowerCase(), en = (m.en || "").toLowerCase();
      var f = (m.fields || []).join(" ").toLowerCase(), tg = (m.tagline || "").toLowerCase();
      var score = -1;
      if (name.indexOf(q) >= 0) score = 0;
      else if (en.indexOf(q) >= 0) score = 1;
      else if (f.indexOf(q) >= 0) score = 2;
      else if (tg.indexOf(q) >= 0) score = 3;
      return { id: id, s: score };
    }).filter(function (x) { return x.s >= 0; })
      .sort(function (a, b) { return a.s - b.s; })
      .slice(0, 12)
      .map(function (x) { return x.id; });
    searchRes.innerHTML = "";
    if (!hits.length) {
      searchRes.innerHTML = '<div class="sres-empty">没有找到匹配的学科，换个关键词试试？</div>';
    } else {
      hits.forEach(function (id) {
        var m = byId[id];
        var st = stageIndex[m.stages[0]];
        var b = document.createElement("button");
        b.className = "sres-item"; b.style.setProperty("--fc", st.meta.color);
        b.innerHTML = "<b>" + esc(m.name) + "</b><span>" + esc(m.en) + '</span><em>' + st.meta.name + "</em>";
        b.addEventListener("click", function () {
          searchRes.classList.remove("open");
          searchInput.value = m.name;
          searchwrap.classList.remove("mopen");
          jumpToNode(id);
        });
        searchRes.appendChild(b);
      });
    }
    searchRes.classList.add("open");
  }
  searchInput.addEventListener("input", function () { doSearch(searchInput.value); });
  searchInput.addEventListener("focus", function () { if (searchInput.value.trim()) doSearch(searchInput.value); });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var first = searchRes.querySelector(".sres-item");
      if (first) first.click();
    }
    if (e.key === "Escape") { searchRes.classList.remove("open"); searchInput.blur(); }
  });
  document.addEventListener("click", function (e) {
    if (!searchwrap.contains(e.target)) searchRes.classList.remove("open");
  });
  var mqMobile = window.matchMedia ? window.matchMedia("(max-width: 640px)") : null;
  document.querySelector(".searchbox").addEventListener("click", function () {
    if (mqMobile && mqMobile.matches) {
      searchwrap.classList.add("mopen");
      setTimeout(function () { searchInput.focus(); }, 0);
    } else {
      searchInput.focus();
    }
  });
  if (mqMobile && mqMobile.matches) {
    document.addEventListener("click", function (e) {
      if (!searchwrap.contains(e.target)) searchwrap.classList.remove("mopen");
    });
  }

  function jumpToNode(id) {
    var target = document.querySelector('.card[data-node="' + id + '"]');
    if (!target) return;
    target.scrollIntoView({ behavior: NOFX ? "auto" : "smooth", block: "center" });
    flash(target);
    openDrawer(id, target.dataset.stage);
  }
  function flash(el) {
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 1700);
  }

  /* ---------- 详情抽屉 ---------- */
  var drawer = document.getElementById("drawer");
  var scrim = document.getElementById("scrim");
  var dStages = document.getElementById("drawerStages");
  var dName = document.getElementById("drawerName");
  var dEn = document.getElementById("drawerEn");
  var dTagline = document.getElementById("drawerTagline");
  var dFields = document.getElementById("drawerFields");
  var dReps = document.getElementById("drawerReps");
  var dNote = document.getElementById("drawerNote");
  var dFieldsSect = document.getElementById("drawerFieldsSect");
  var dRepsSect = document.getElementById("drawerRepsSect");
  var currentId = null;

  function openDrawer(id, fromStage) {
    var m = byId[id]; if (!m) return;
    currentId = id;
    var primStage = stageIndex[m.stages[0]].meta;
    drawer.style.setProperty("--stage", primStage.color);
    drawer.style.setProperty("--stage2", primStage.color);
    dName.textContent = m.name;
    dEn.textContent = m.en;
    dTagline.textContent = m.tagline || "";
    dStages.innerHTML = "";
    m.stages.forEach(function (sid) {
      var st = stageIndex[sid].meta;
      var chip = document.createElement("button");
      chip.className = "schip" + (sid === fromStage ? " schip--cur" : "");
      chip.style.setProperty("--sc", st.color);
      chip.innerHTML = "<i></i>" + st.num + " " + esc(st.name);
      chip.title = "跳到「" + st.name + "」阶段的这张卡片";
      chip.addEventListener("click", function () { closeDrawer(); setTimeout(function () { jumpToCard(sid, id); }, 60); });
      dStages.appendChild(chip);
    });
    dFields.innerHTML = "";
    m.fields.forEach(function (f) { var s = document.createElement("span"); s.className = "dchip"; s.textContent = f; dFields.appendChild(s); });
    dFieldsSect.style.display = m.fields.length ? "" : "none";
    dReps.innerHTML = "";
    m.reps.forEach(function (r) { var li = document.createElement("li"); li.textContent = r; dReps.appendChild(li); });
    dRepsSect.style.display = m.reps.length ? "" : "none";
    var notes = [];
    if (m.cross) notes.push("本学科横跨多个阶段：图中相关阶段都会出现同一张卡片，点上方阶段胶囊可跳到另一处。");
    if (m.tcm) notes.push("本条目属于中国传统医学体系，独立标注、平行呈现，供体系对照阅读。");
    if (notes.length) { dNote.hidden = false; dNote.textContent = notes.join(" "); } else { dNote.hidden = true; }
    drawer.classList.add("open"); scrim.classList.add("open");
  }
  function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("open"); currentId = null; }
  function jumpToCard(sid, id) {
    var el = document.getElementById("card-" + sid + "-" + id);
    if (el) { el.scrollIntoView({ behavior: NOFX ? "auto" : "smooth", block: "center" }); flash(el); }
  }
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeDrawer(); } });

  /* ---------- 深链与初始化 ---------- */
  (function init() {
    computeActive();
    var sid = params.get("s");
    if (sid && document.getElementById(sid)) {
      setTimeout(function () { document.getElementById(sid).scrollIntoView({ behavior: NOFX ? "auto" : "smooth", block: "start" }); }, 30);
    }
    var nodeParam = params.get("node");
    if (nodeParam && byId[nodeParam]) {
      setTimeout(function () { jumpToNode(nodeParam); }, 60);
    }
    if (params.get("to") === "bottom") {
      window.scrollTo(0, document.body.scrollHeight);
    }
    if (params.get("qa") === "1") { document.title = "[READY] " + document.title; }
  })();
  window.addEventListener("load", function () { computeActive(); });

  /* QA 钩子 */
  window.__medmap = {
    rescan: computeActive,
    open: openDrawer,
    jump: jumpToNode,
    state: function () { return { active: lastActive, theme: document.documentElement.getAttribute("data-theme"), cards: cardsCount, unique: uniqueIds.length }; }
  };
})();
</script>
</body>
</html>
